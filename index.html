    onSnapshot(cb){ const f=()=>{ const d=(store[coll]||{})[id]; cb({id,exists:!!d,data:()=>d,metadata:{fromCache:false}}); }; listeners.push(f); setTimeout(f,0); return ()=>{}; }
  };},
  collection(coll){ return { onSnapshot(cb){ const f=()=>cb(snapColl(coll)); listeners.push(f); setTimeout(f,0); return ()=>{}; } }; }
};
const localDownloads = { save({filename,data}){ const blob=new Blob([data],{type:filename.endsWith(".json")?"application/json":"text/csv"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); return Promise.resolve({status:"saved"}); } };
const useCap = n => Promise.resolve(n==="db"?localDb:n==="downloads"?localDownloads:null);

const n0 = v => { const x = parseFloat(v); return isFinite(x)?x:0; };
const STOCK = {in:"In stock",low:"Low stock",pre:"Pre-order",out:"Out of stock",unverified:"Stock unverified",na:"No stock check"};
const CATS = ["Core kit","Lighting & relays","Sensors","Energy","Cameras","Network","Other"];

let route={view:"quotes",id:null};

/* ---------- write queue: one write at a time per doc ---------- */
const chains={}, timers={};
function queueWrite(path, fn){
  chains[path]=(chains[path]||Promise.resolve()).then(fn).catch(e=>{
    if(e&&e.code==="invalid_argument"){readOnly=true;toast("You can view these quotes but can’t change them.");}
    else if(e&&e.code==="quota_exceeded"){toast("Storage is full. Delete old quotes to save new ones.");}
    else toast("Couldn’t save. Check your connection and try again.");
  });
  return chains[path];
}
function saveQuote(q, delay=0){
  q.updated=Date.now();
  const path="quotes/"+q.id;
  clearTimeout(timers[path]);
  const body=JSON.parse(JSON.stringify(q));
  const run=()=>queueWrite(path,()=>db.doc(path).set(body));
  if(delay) timers[path]=setTimeout(run,delay); else run();
}

/* ---------- math ---------- */
function calc(q){
  const hw=(q.lines||[]).reduce((s,l)=>s+n0(l.qty)*n0(l.price),0);
  const imp=hw*n0(q.importPct)/100, landed=hw+imp, mk=landed*n0(q.markup)/100, labor=n0(q.laborHours)*n0(q.laborRate);
  const price=landed+mk+labor;
  const yrHa=n0(rates.haCloudYr), yrCl=n0(rates.claudeMo)*12, yrTw=n0(q.msgs)*n0(rates.twilioPerMsg)*12, yrMt=n0(q.tpls)*n0(rates.metaTpl)*12;
  const yrCost=yrHa+yrCl+yrTw+yrMt, yrRev=n0(q.serviceFee)*12;
  const noPrice=(q.lines||[]).filter(l=>!(n0(l.price)>0)).length;
  return {hw,imp,landed,mk,labor,price,margin:price-landed,yrHa,yrCl,yrTw,yrMt,yrCost,yrRev,yrMargin:yrRev-yrCost,noPrice};
}

}

/* ---------- actions ---------- */
function curQuote(){ return quotes.find(x=>x.id===route.id); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function toast(msg){ const h=$("#toast-host"); h.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>h.innerHTML="",2400); }

function newQuote(){
  const q={id:uid(),client:"",site:"",date:new Date().toISOString().slice(0,10),created:Date.now(),rooms:["Core"],lines:[],
    markup:0,laborHours:0,laborRate:0,importPct:0,serviceFee:0,msgs:300,tpls:30};
  catalog.filter(i=>i.kit).sort((a,b)=>(a.sort||0)-(b.sort||0)).forEach(i=>q.lines.push({lid:uid(),itemId:i.id,name:i.name,price:n0(i.price),room:"Core",qty:1}));
  quotes.push(q); saveQuote(q); location.hash="q-"+q.id;
}
function addLine(itemId, room){
  const q=curQuote(), it=catalog.find(c=>c.id===itemId); if(!q||!it) return;
  const ex=q.lines.find(l=>l.itemId===itemId&&l.room===room);
  if(ex) ex.qty=n0(ex.qty)+1; else q.lines.push({lid:uid(),itemId,name:it.name,price:n0(it.price),room,qty:1});
  saveQuote(q); render(); toast("Added "+it.name);
}
function quoteText(q){
  const c=calc(q); let t=`CasaControl quote — ${q.client||"Client"}${q.site?" ("+q.site+")":""}, ${q.date||""}\n`;
  (q.rooms||[]).forEach(r=>{const ls=q.lines.filter(l=>l.room===r); if(!ls.length) return; t+=`\n${r}\n`; ls.forEach(l=>t+=`  ${l.qty} × ${l.name} — ${money(n0(l.qty)*n0(l.price))}\n`);});
  t+=`\nHardware ${money(c.hw)} · Import ${money(c.imp)} · Markup ${money(c.mk)} · Labor ${money(c.labor)}\nPrice to client: ${money(c.price)}\nMonthly service: ${money(n0(q.serviceFee))}\n`;
  return t;
}
function quoteCsv(q){
  const c=calc(q), cell=v=>`"${String(v).replace(/"/g,'""')}"`;
  const rows=[["Room","Item","Qty","Unit cost","Line total"]];
  q.lines.forEach(l=>rows.push([l.room,l.name,n0(l.qty),n0(l.price).toFixed(2),(n0(l.qty)*n0(l.price)).toFixed(2)]));
  rows.push([],["Hardware","","","",c.hw.toFixed(2)],["Import / freight","","","",c.imp.toFixed(2)],["Markup","","","",c.mk.toFixed(2)],["Install labor","","","",c.labor.toFixed(2)],["Price to client","","","",c.price.toFixed(2)],["Your margin","","","",c.margin.toFixed(2)],[],
    ["Annual running cost","","","",c.yrCost.toFixed(2)],["Annual service revenue","","","",c.yrRev.toFixed(2)],["Annual recurring margin","","","",c.yrMargin.toFixed(2)]);
  return rows.map(r=>r.map(cell).join(",")).join("\n");
}

document.addEventListener("click", async e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, q=curQuote();
  if(act==="new-quote") newQuote();
  else if(act==="add-item") openPicker(b.dataset.room);
  else if(act==="close-sheet") closeSheet();
  else if(act==="pick-cat"){ pickerState.cat=b.dataset.cat; renderPicker(); }
  else if(act==="pick") addLine(b.dataset.id, pickerState.room);
  else if((act==="inc"||act==="dec")&&q){ const l=q.lines.find(x=>x.lid===b.dataset.lid); if(!l) return;
    l.qty=n0(l.qty)+(act==="inc"?1:-1); if(l.qty<=0) q.lines=q.lines.filter(x=>x!==l); saveQuote(q,400); render(); }
  else if(act==="add-room"&&q){ const v=$("#new-room").value.trim(); if(!v) return; if(q.rooms.includes(v)){toast("That room is already on this quote.");return;}
    q.rooms.push(v); saveQuote(q); render(); }
  else if(act==="del-room"&&q){ q.rooms=q.rooms.filter(r=>r!==b.dataset.room); saveQuote(q); render(); }
  else if(act==="toggle-totals"){ const h=$("#totals-host"); h.dataset.open=h.dataset.open==="1"?"0":"1"; renderTotals(); }
  else if(act==="copy"&&q){ const t=quoteText(q); try{ await navigator.clipboard.writeText(t); toast("Summary copied"); }catch(_){ $("#del-confirm").innerHTML=`<textarea style="width:100%;min-height:200px;font:inherit" readonly id="copy-fallback">${esc(t)}</textarea>`; const ta=$("#copy-fallback"); ta.select(); toast("Select all and copy"); } }
  else if(act==="csv"&&q){ let dl=null; try{ dl=await useCap("downloads"); }catch(_){} if(!dl){toast("Downloads aren’t available here. Use Copy summary instead.");return;}
    try{ await dl.save({filename:`CasaControl-${(q.client||"quote").replace(/[^\w-]+/g,"_")}-${q.date||""}.csv`,data:quoteCsv(q)}); toast("CSV saved"); }
    catch(err){ if(err&&err.code!=="declined") toast("Couldn’t save the CSV. Use Copy summary instead."); } }
  else if(act==="ask-del"){ $("#del-confirm").innerHTML=`<div class="notice row" style="justify-content:space-between"><span>Delete this quote for good?</span><span class="row"><button data-act="cancel-del" id="btn-cancel-del">Keep it</button><button class="danger" data-act="do-del" id="btn-do-del">Delete</button></span></div>`; }
  else if(act==="cancel-del") $("#del-confirm").innerHTML="";
  else if(act==="do-del"&&q){ const id=q.id; quotes=quotes.filter(x=>x.id!==id); queueWrite("quotes/"+id,()=>db.doc("quotes/"+id).delete()); location.hash="quotes"; toast("Quote deleted"); }
  else if(act==="backup"){ localDownloads.save({filename:"casacontrol-backup-"+new Date().toISOString().slice(0,10)+".json",data:JSON.stringify(store)}); toast("Backup downloaded"); }
  else if(act==="new-item") openItemEditor(null);
  else if(act==="edit-item") openItemEditor(b.dataset.id);
  else if(act==="del-item"){ $("#item-del-confirm").innerHTML=`<div class="notice row" style="justify-content:space-between"><span>Delete this part? Existing quotes keep their lines.</span><button type="button" class="danger" data-act="do-del-item" data-id="${esc(b.dataset.id)}" id="btn-do-del-item">Delete</button></div>`; }
  else if(act==="do-del-item"){ const id=b.dataset.id; catalog=catalog.filter(c=>c.id!==id); queueWrite("catalog/"+id,()=>db.doc("catalog/"+id).delete()); closeSheet(); render(); toast("Part deleted"); }
});

document.addEventListener("input", e=>{
  const t=e.target, q=curQuote();
  if(t.id==="pick-search"&&pickerState){ pickerState.q=t.value; renderPicker(); return; }
  if(t.id&&t.id.startsWith("q-")&&q){ const k=t.id.slice(2); q[k]=t.value; saveQuote(q,700); renderTotals(); return; }
  if(t.id&&t.id.startsWith("r-")){ const k=t.id.slice(2); rates[k]=n0(t.value); clearTimeout(timers.rates);
    timers.rates=setTimeout(()=>queueWrite("config/rates",()=>db.doc("config/rates").set({...rates})),700); }
});

document.addEventListener("change", e=>{
  if(e.target.id!=="restore-file"||!e.target.files[0]) return;
  const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||!d.catalog) throw 0; store=d; persist(); toast("Backup restored"); }catch(_){ toast("That file isn’t a CasaControl backup."); } }; r.readAsText(e.target.files[0]);
});
document.addEventListener("submit", e=>{
  if(e.target.id!=="item-form") return; e.preventDefault();
  const id=e.target.dataset.id||("p-"+uid());
  const prev=catalog.find(c=>c.id===id)||{};
  const it={...prev,id,name:$("#i-name").value.trim(),spec:$("#i-spec").value.trim(),cat:$("#i-cat").value,price:n0($("#i-price").value),
    vendor:$("#i-vendor").value.trim(),stock:$("#i-stock").value,checked:$("#i-checked").value,kit:$("#i-kit").checked,url:$("#i-url").value.trim(),note:$("#i-note").value.trim(),sort:prev.sort||999};
  if(!it.name){toast("Give the part a name.");return;}
  const i=catalog.findIndex(c=>c.id===id); if(i>=0) catalog[i]=it; else catalog.push(it);
  const body={...it}; delete body.id;
  queueWrite("catalog/"+id,()=>db.doc("catalog/"+id).set(body));
  closeSheet(); render(); toast("Part saved");
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape"&&sheetOpen) closeSheet(); if(e.key==="Enter"&&e.target.id==="new-room"){ e.preventDefault(); $("#btn-add-room").click(); } });

/* ---------- boot ---------- */
readRoute();
(async function boot(){
  try{ db=await useCap("db"); }catch(_){ db=null; }
  if(!db){ render(); return; }
  try{ const user=await useCap("user"); if(user){ const w=await user.can("data.write"); if(w===false) readOnly=true; } }catch(_){}
  render();
  const timer=setTimeout(()=>{},0);
  const done=()=>{ if(loaded.catalog&&loaded.quotes){clearTimeout(timer);offline=false;} };
  db.collection("catalog").onSnapshot(s=>{
    catalog=s.docs.map(d=>({id:d.id,...d.data()})); if(!s.metadata.fromCache) loaded.catalog=true; else loaded.catalog=loaded.catalog||s.size>0;
    done(); if(sheetOpen!=="item") { if(sheetOpen==="picker") renderPicker(); render(); }
  },()=>{loaded.catalog=true;offline=true;render();});
  db.collection("quotes").onSnapshot(s=>{
    const fresh=s.docs.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data()))}));
    quotes=fresh.map(f=>{ const local=quotes.find(x=>x.id===f.id); return (local&&(local.updated||0)>(f.updated||0))?local:f; });
    if(!s.metadata.fromCache) loaded.quotes=true; else loaded.quotes=loaded.quotes||s.size>0;
    done(); render();
  },()=>{loaded.quotes=true;offline=true;render();});
  db.doc("config/rates").onSnapshot(s=>{ if(s.exists) rates={...rates,...s.data()}; if(route.view!=="catalog"||!document.activeElement||!String(document.activeElement.id).startsWith("r-")) render(); },()=>{});
})();
})();
</script>

</body></html>
